name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 24.04 is the image Tauri documents; ubuntu-latest (26.04) hung for 10+ min in apt.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Compile-time deps only (no bundling): https://v2.tauri.app/start/prerequisites/#linux
      - name: Tauri system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db rebuilds its index on every install and is very slow on runners
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Frontend (lint, format, build)
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run format:check
          bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # tauri::generate_context! needs apps/desktop/dist, so the frontend builds first.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -f server/Dockerfile .
