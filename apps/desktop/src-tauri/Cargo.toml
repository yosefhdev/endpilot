[package]
name = "endpilot-desktop"
description = "App de escritorio de Endpilot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
endpilot-core.workspace = true
endpilot-http.workspace = true
tokio = { workspace = true, features = ["sync"] }
tauri-plugin-dialog = "2"

[lints]
workspace = true
