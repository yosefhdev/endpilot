[package]
name = "endpilot-server"
description = "API de Endpilot (REST + WebSocket)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
endpilot-core.workspace = true
tokio.workspace = true
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
argon2 = "0.6"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
