# Dev stack. Run from repo root:
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
#   docker compose -f deploy/docker-compose.dev.yml watch   # rebuild api on change
name: endpilot-dev

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      RUST_LOG: ${RUST_LOG:-debug}
      DATABASE_URL: postgres://${POSTGRES_USER:-endpilot}:${POSTGRES_PASSWORD:-endpilot}@postgres:5432/${POSTGRES_DB:-endpilot}
      REDIS_URL: redis://redis:6379
      # Dev only. Production reads it from deploy/.env.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789abcdef}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]
    develop:
      watch:
        - { action: rebuild, path: ../server }
        - { action: rebuild, path: ../crates }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-endpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-endpilot}
      POSTGRES_DB: ${POSTGRES_DB:-endpilot}
    volumes: [pgdata:/var/lib/postgresql/data]
    # 5433 on the host so it doesn't clash with a locally installed Postgres
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: http://localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports: ["80:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddydata:
