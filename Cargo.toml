[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
endpilot-core = { path = "crates/core" }
endpilot-http = { path = "crates/http" }
endpilot-store = { path = "crates/store" }
endpilot-postman-compat = { path = "crates/postman-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
